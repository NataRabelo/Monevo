<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperação Senha | Monevo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/recuperar.css') }}">

    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>

<body>
    <div class="main-wrapper">
        
        <form action="{{ url_for('auth.recuperar_senha_email') }}" method="POST" id="recuperar-form">
            <h1 class="form-title"><i class="fas fa-lock-open"></i> Monevo</h1>
            <h2 class="texto-central mb-4">Recuperação de Senha</h2>

            <p class="instrucao-texto">
                Digite o email cadastrado abaixo. Enviaremos um link para redefinir sua senha.
            </p>

            <div class="email mb-4">
                <label for="email" class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control" id="campo-email" name="email" required placeholder="seu.email@exemplo.com">
                </div>
            </div>

            <button type="submit" class="botao w-100">
                <i class="fas fa-paper-plane"></i> Enviar Link de Recuperação
            </button>

            <div class="texto-central mt-4">
                <a href="{{ url_for('auth.login') }}">← Voltar para o Login</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/recuperar.js') }}"></script>
</body>
</html>

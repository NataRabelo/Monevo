<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha nova | Monevo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/senhaNova.css') }}">

    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>

<body>
  <!-- FLASH MENSAGENS -->
  {% include 'partials/flash_messages.html' %}
    <div class="main-wrapper-senha">

        <div class="container-senha">
            <h2 class="titulo-formulario"><i class="fas fa-key"></i> Definir Nova Senha</h2>
            <p class="instrucao-texto mb-4">
                Sua nova senha deve ser diferente das senhas usadas anteriormente.
            </p>

            <form action="{{ url_for('auth.recuperar_senha_editar', user_id=user_id) }}" method="POST"
                id="formulario-nova-senha">

                <input type="hidden" name="codigo" value="{{ keyValidation }}">

                <div class="nova-senha mb-4">
                    <label for="campo-senha" class="form-label">Nova Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="campo-senha" name="senha" required>
                    </div>
                </div>

                <div class="senha-confirmacao mb-4">
                    <label for="campo-senha-confirmacao" class="form-label">Confirme a Nova Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="campo-senha-confirmacao"
                            name="senha_confirmacao" required>
                    </div>
                </div>

                <button type="submit" class="btn botao w-100">
                    <i class="fas fa-save"></i> Salvar e Acessar
                </button>
            </form>

            <div class="texto-central mt-4">
                <a href="{{ url_for('auth.login') }}">← Voltar para a tela de login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/senhaNova.js') }}"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Usuário | Monevo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/editar.css') }}">

    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>

<body>
    <!-- FLASH MENSAGENS -->
    {% include 'partials/flash_messages.html' %}

    <div class="main-wrapper-editar">

        <form action="{{ url_for('user.editarUsuario') }}" method="POST" class="formulario-editar">
            <h2 class="titulo-formulario"><i class="fas fa-edit"></i> Edição de Perfil</h2>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label for="campo-nome" class="form-label">Nome:</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="campo-nome" name="nome" required
                            value="{{usuario.nome}}">
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <label for="campo-sobrenome" class="form-label">Sobrenome:</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user-tag"></i></span>
                        <input type="text" class="form-control" id="campo-sobrenome" name="sobrenome" required
                            value="{{usuario.sobrenome}}">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 mb-4">
                    <label for="campo-email" class="form-label">Email:</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="campo-email" name="email" required
                            value="{{usuario.email}}">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-7 mb-4">
                    <label for="campo-celular" class="form-label">Celular:</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                        <input type="text" class="form-control" id="campo-celular" name="celular"
                            value="{{usuario.celular}}" placeholder="(XX) XXXXX-XXXX">
                    </div>
                </div>

                <div class="col-md-5 mb-4">
                    <label for="campo-cpf" class="form-label">CPF:</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                        <input type="text" class="form-control" id="campo-cpf" name="cpf" required
                            value="{{usuario.cpf}}" placeholder="000.000.000-00">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 mb-4">
                    <label for="campo-senha" class="form-label">Nova Senha (opcional):</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="campo-senha" name="senha"
                            placeholder="Deixe em branco para manter a senha atual">
                    </div>
                </div>
            </div>

            <div class="botoes-acoes mt-3">
                <button type="submit" class="botao-enviar">
                    <i class="fas fa-save"></i> Salvar Edição
                </button>

                <button type="button" class="botao-voltar" onclick='window.location.href="{{ url_for("main.menu") }}"'>
                    <i class="fas fa-arrow-left"></i> Voltar
                </button>

                <button type="button" class="botao-deletar" data-bs-toggle="modal"
                    data-bs-target="#modalConfirmarExclusao">
                    <i class="fas fa-trash-alt"></i> Deletar
                </button>
            </div>

        </form>
    </div>

    <div class="modal fade" id="modalConfirmarExclusao" tabindex="-1" aria-labelledby="modalExcluirLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header modal-custom-header">
                    <h5 class="modal-title" id="modalExcluirLabel"><i class="fas fa-exclamation-triangle"></i> Confirmar
                        Exclusão</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <div class="modal-body modal-custom-body">
                    Esta ação é <strong>irreversível</strong>.<br><br>
                    Ao confirmar, todos os seus dados, histórico e informações associadas à sua conta serão
                    <strong>excluídos permanentemente</strong> do sistema.<br><br>
                    Deseja realmente prosseguir com a exclusão da conta?
                </div>


                <div class="modal-footer modal-custom-footer">
                    <button type="button" class="btn btn-cancelar" data-bs-dismiss="modal">Cancelar</button>

                    <form action="{{ url_for('user.deletarUsuario', id=usuario.id) }}" method="POST"
                        style="display: inline;">
                        <button type="submit" class="btn btn-excluir">Sim, excluir permanentemente</button>
                    </form>
                </div>


            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/editar.js') }}"></script>
</body>

</html>

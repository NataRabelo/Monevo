<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Monevo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="/app/static/css/login.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>

<body>
    {% include 'partials/flash_messages.html' %}

    <div class="main-screen">
        
        <div class="creative-side">
            <h1 class="creative-title"><i class="fas fa-chart-line"></i> Monevo</h1>
            <p class="creative-slogan">Sua plataforma completa de gestão financeira.</p>
            <div class="creative-illustration">
                <i class="fas fa-wallet fa-4x"></i>
                <i class="fas fa-piggy-bank fa-4x"></i>
                <i class="fas fa-file-invoice-dollar fa-4x"></i>
            </div>
        </div>

        <div class="login-form-side">
            <div class="login-container">
                <h2 class="texto-central">Acesso ao Sistema</h2>

                <form id="loginForm" action="{{ url_for('auth.login')}}" method="POST">
                    <div class="mb-4">
                        <label for="email" class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control" id="campo-email" name="email" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="senha" class="form-label">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="campo-senha" name="senha" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn botao-login w-100">
                        <i class="fas fa-right-to-bracket"></i> Entrar
                    </button>
                </form>

                <div class="texto-central mt-4">
                    <a href="{{ url_for('auth.recuperar_senha_email')}}">Recuperar senha</a>
                    <span>|</span>
                    <a href="{{ url_for('user.cadastroUsuario')}}">Criar Conta</a>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
